# Автодеплой на VPS при push в ветку main.
# Настройка один раз (см. комментарии внизу файла в ответе ассистента или в репозитории GitHub → Settings → Secrets).
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Только имя хоста или IP, БЕЗ https:// и БЕЗ / в конце (иначе dial tcp ... unknown port)
          host: ${{ secrets.DEPLOY_HOST }}
          port: 22
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Обязателен, если приватный ключ создан с passphrase (иначе: ssh.ParsePrivateKey: passphrase protected)
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            cd /var/www/messenger
            git fetch origin
            # Серверный клон должен совпадать с GitHub; при расхождении --ff-only падает.
            git checkout main
            git reset --hard origin/main
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            cd /var/www/messenger/web
            npm ci
            npm run build
            sudo systemctl restart messenger
            sudo systemctl reload nginx
