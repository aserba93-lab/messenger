# Фрагмент для server { } сайта на Vue/React (Vite).
# Положите root на каталог web/dist после сборки, например:
#   root /var/www/messenger/web/dist;
#
# ВАЖНО: вложения (картинки, голос) идут через Node: /files/* и /graphql — их нужно проксировать
# ДО fallback location /, иначе nginx отдаст index.html и в новой вкладке откроется тот же SPA, img/audio сломаются.
#
# Пример (порт бэкенда подставьте свой, напр. 3000):
#
# location ^~ /graphql  { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
# location ^~ /socket.io/ { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 86400; }
# location ^~ /files/   { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_request_buffering off; client_max_body_size 200m; }
# location ^~ /auth/    { proxy_pass http://127.0.0.1:3000; ... }
#
# Проблема: браузер/CDN долго держат старый index.html → грузится старый JS (старый «UI-сборка»).
# Решение: не кешировать главную точку входа SPA.

location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
}

# Проверка деплоя: после сборки Vite кладёт build-info.json в dist — откройте /build-info.json в браузере
location = /build-info.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
}

# Опционально: ассеты с хешем в имени можно кешировать долго (Vite сам меняет имя файла при каждой сборке).
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
